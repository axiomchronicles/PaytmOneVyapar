[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "vyapaar-commander-backend"
version = "0.1.0"
description = "Backend and agent runtime for Vyapaar Commander"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "arq==0.28.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langchain==1.4.1",
  "langchain-openai==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "lightgbm==4.7.0",
  "numpy==2.5.3",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pandas==3.0.6",
  "pillow==11.3.0",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.15.0",
  "psycopg[binary,pool]==3.3.5",
  "python-multipart==0.0.32",
  "pyjwt[crypto]==2.14.0",
  "redis[hiredis]==5.3.1",
  "sarvamai==0.1.33",
  "scikit-learn==1.9.1",
  "sentry-sdk[fastapi]==2.69.2",
  "sqlalchemy[asyncio]==2.0.54",
  "structlog==26.1.0",
  "uvicorn[standard]==0.53.0",
  "pip>=26.2.1",
  "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008", "E501", "S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"scripts/**/*.py" = ["S105", "S106"]
